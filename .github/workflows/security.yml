name: Security

# Same scanners and severity rules as the local no-mistakes gates
# (see .no-mistakes.yaml and scripts/security/gate.mjs).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1" # weekly, to catch newly published CVEs in unchanged deps
  workflow_dispatch:

permissions:
  contents: read

env:
  # Bump the version and its SHA-256 together (from the release's checksums file).
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  SEMGREP_VERSION: 1.183.0

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
      - run: node scripts/security/gate.mjs secrets

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "semgrep==${SEMGREP_VERSION}"
      - run: node scripts/security/gate.mjs sast

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install osv-scanner
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          install -m 755 "$RUNNER_TEMP/osv-scanner" /usr/local/bin/osv-scanner
      - run: node scripts/security/gate.mjs deps

  # New nosemgrep / gitleaks:allow comments, scanner ignore files and pipeline
  # edits. Advisory here (the PR review is the approval); blocking in no-mistakes.
  suppressions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/security/gate.mjs suppressions --advisory
        env:
          SECURITY_BASE_REF: origin/${{ github.base_ref }}
