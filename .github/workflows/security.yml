name: Security

# Same scanners and severity rules as the local no-mistakes gates
# (see .no-mistakes.yaml and scripts/security/gate.mjs).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1" # weekly, to catch newly published CVEs in unchanged deps
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  OSV_SCANNER_VERSION: 2.7.0
  SEMGREP_VERSION: 1.183.0

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
      - run: node scripts/security/gate.mjs secrets --history

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "semgrep==${SEMGREP_VERSION}"
      - run: node scripts/security/gate.mjs sast

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install osv-scanner
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
      - run: node scripts/security/gate.mjs deps
