version: 2
updates:
  # Keeps the SHA-pinned actions current. Scanner versions in
  # .github/workflows/security.yml are bumped by hand with their checksums.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
